<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 駆動開発デモ</title>
<style>
  :root { --washi: #f1e9d6; --sumi: #26231f; --shu: #c8402f; --kin: #b08d3c; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: var(--washi); color: var(--sumi);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", "Noto Serif JP", serif;
    line-height: 1.8;
  }
  main { max-width: 34em; padding: 32px 20px; }
  h1 { font-size: 24px; letter-spacing: .15em; margin: 0 0 8px; }
  p { margin: 0 0 14px; }
  .play {
    display: inline-block; margin: 8px 0 20px; padding: 10px 28px;
    background: var(--shu); color: var(--washi); text-decoration: none;
    font-size: 20px; letter-spacing: .3em; border: 3px double var(--kin);
  }
  .play:hover, .play:focus { background: #a8321f; }
  a { color: var(--shu); }
  .note { font-size: 14px; color: #4a443b; }
</style>
</head>
<body>
<main>
  <h1>AI 駆動開発デモ</h1>
  <p>人が仕様を決め、実装・レビュー・マージは AI が行う流れで作った、和風の落ちものパズルです。</p>
  <a class="play" href="game/">色紙落とし</a>
  <p><a href="slides/">紹介スライド「人がしたのは、チャットだけ。」</a></p>
  <p class="note">パソコンのキーボードで遊びます。仕様と作り方は <a href="https://github.com/kotaroyatabe0235/ai-driven-dev-demo">GitHub のリポジトリ</a>にあります。</p>
</main>
</body>
</html>
